openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /chat:
    post:
      operationId: sendChatMessage
      summary: Ask the Brew Logic shop assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          description: Invalid message or history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "429":
          description: Visitor or provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "503":
          description: Assistant temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 500
    ChatReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        error:
          type: string
          enum: [invalid_message, rate_limited, unavailable]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

