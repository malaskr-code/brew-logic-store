openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /products:
    get:
      operationId: getProducts
      summary: Read all live products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogProduct" }
        "503": { description: Database unavailable }
  /bundles:
    get:
      operationId: getBundles
      summary: Read all live bundles
      responses:
        "200":
          description: Bundles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogBundle" }
        "503": { description: Database unavailable }
  /auth/signup:
    post:
      operationId: signupCustomer
      summary: Create a customer account and session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerSignupInput" }
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "400":
          description: Invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "403": { description: Cross-site request refused }
        "429": { description: Too many attempts }
        "503": { description: Authentication unavailable }
  /auth/login:
    post:
      operationId: loginCustomer
      summary: Start a seven-day customer session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "400":
          description: Invalid fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "403": { description: Cross-site request refused }
        "429": { description: Too many attempts }
        "503": { description: Authentication unavailable }
  /auth/logout:
    post:
      operationId: logoutCustomer
      summary: Clear the customer session cookie
      responses:
        "204": { description: Logged out }
        "403": { description: Cross-site request refused }
  /auth/me:
    get:
      operationId: getCustomerSession
      summary: Read the signed-in customer, or null
      responses:
        "200":
          description: Customer session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSession" }
        "503": { description: Authentication unavailable }
  /auth/verification/resend:
    post:
      operationId: resendCustomerVerification
      summary: Send a fresh verification link to the signed-in customer
      description: Limited to once per minute and five attempts per hour per account. Requires a customer session, not Clerk.
      responses:
        "200":
          description: Email accepted for delivery, or account already verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerVerificationDelivery" }
        "401": { description: Customer login required }
        "403": { description: Cross-site request refused }
        "429":
          description: Resend limit reached
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "503":
          description: Email delivery or accounts unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
  /auth/verification/confirm:
    post:
      operationId: confirmCustomerVerification
      summary: Consume a single-use verification token without creating a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerVerificationInput" }
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerVerificationResult" }
        "400":
          description: Invalid, expired, superseded or already consumed token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAuthError" }
        "403": { description: Cross-site request refused }
        "429": { description: Too many attempts }
        "503": { description: Accounts unavailable }
  /catalog:
    get:
      operationId: getCatalog
      summary: Read the live Brew Logic catalog
      responses:
        "200":
          description: Products and bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "503":
          description: Database unavailable
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Read the catalog after verifying administrator access
      responses:
        "200":
          description: Administrator catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "503":
          description: Database unavailable
    post:
      operationId: createCatalogEntry
      summary: Create a product or bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryInput"
        "400":
          description: Invalid catalog entry
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "409":
          description: Identifier already exists
        "503":
          description: Database unavailable
  /admin/catalog/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 80
    put:
      operationId: updateCatalogEntry
      summary: Replace a product or bundle without changing its identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogEntryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntryInput"
        "400":
          description: Invalid catalog entry
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Entry not found
        "409":
          description: Product name already exists
        "503":
          description: Database unavailable
    delete:
      operationId: deleteCatalogEntry
      summary: Remove a product or bundle
      responses:
        "204":
          description: Deleted
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Entry not found
        "409":
          description: Product is included in a bundle
        "503":
          description: Database unavailable
  /geo:
    get:
      operationId: getVisitorGeo
      summary: Locate the visitor without exposing the location API URL
      parameters:
        - in: query
          name: testip
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Country and first currency from the location provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
        "400":
          description: Missing or invalid visitor IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
        "503":
          description: Location unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorGeo"
  /rates:
    get:
      operationId: getExchangeRates
      summary: Get exchange rates based in KWD
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRates"
        "503":
          description: Exchange rates unavailable
  /chat:
    post:
      operationId: sendChatMessage
      summary: Ask the Brew Logic shop assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          description: Invalid message or history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "429":
          description: Visitor or provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "503":
          description: Assistant temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CustomerUser:
      type: object
      required: [id, name, email, createdAt, emailVerified]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        emailVerified: { type: boolean, description: False for legacy accounts until ownership is proven }
    CustomerSession:
      type: object
      required: [user]
      properties:
        verificationDelivery:
          type: string
          enum: [sent, unavailable]
          description: Returned on signup; unavailable never means an email was sent.
        user:
          anyOf:
            - { $ref: "#/components/schemas/CustomerUser" }
            - { type: "null" }
    CustomerVerificationInput:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$", minLength: 64, maxLength: 64 }
    CustomerVerificationResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified] }
    CustomerVerificationDelivery:
      type: object
      required: [status, retryAfterSeconds]
      properties:
        status: { type: string, enum: [sent, already_verified] }
        retryAfterSeconds: { type: integer, minimum: 0 }
    CustomerLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
    CustomerSignupInput:
      allOf:
        - { $ref: "#/components/schemas/CustomerLoginInput" }
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
    CustomerAuthError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [validation, email_in_use, invalid_credentials, rate_limited, cross_site, unavailable, invalid_verification, email_unavailable] }
        retryAfterSeconds: { type: integer, minimum: 0 }
    CatalogResponse:
      type: object
      required: [products, bundles]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        bundles:
          type: array
          items:
            $ref: "#/components/schemas/CatalogBundle"
    CatalogProduct:
      type: object
      required: [id, name, price, category, image, description, why]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: number, minimum: 0, maximum: 100000 }
        category: { type: string, enum: [machine, bean] }
        image: { type: string, minLength: 1, maxLength: 2000 }
        description: { type: string, maxLength: 2000 }
        why: { type: string, maxLength: 2000 }
        descriptionAr: { type: string, maxLength: 2000 }
        whyAr: { type: string, maxLength: 2000 }
        detailDescription: { type: string, maxLength: 4000 }
        detailDescriptionAr: { type: string, maxLength: 4000 }
        origin: { type: string, maxLength: 200 }
        originAr: { type: string, maxLength: 200 }
        bagSize: { type: string, maxLength: 80 }
    CatalogBundle:
      type: object
      required: [id, name, price, regular, items, note]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: number, minimum: 0, maximum: 100000 }
        regular: { type: number, minimum: 0, maximum: 100000 }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, maxLength: 2000 }
        noteAr: { type: string, maxLength: 2000 }
    CatalogProductInput:
      allOf:
        - $ref: "#/components/schemas/CatalogProduct"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [product] }
    CatalogBundleInput:
      allOf:
        - $ref: "#/components/schemas/CatalogBundle"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [bundle] }
    CatalogEntryInput:
      oneOf:
        - $ref: "#/components/schemas/CatalogProductInput"
        - $ref: "#/components/schemas/CatalogBundleInput"
    VisitorGeo:
      type: object
      required: [countryCode, currency]
      properties:
        countryCode:
          type: [string, "null"]
        currency:
          type: [string, "null"]
    ExchangeRates:
      type: object
      required: [result, base_code, rates]
      properties:
        result:
          type: string
          enum: [success]
        base_code:
          type: string
          enum: [KWD]
        rates:
          type: object
          additionalProperties:
            type: number
            minimum: 0
    ChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 500
    ChatReply:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        error:
          type: string
          enum: [invalid_message, rate_limited, unavailable]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

