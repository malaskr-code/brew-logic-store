kind = "web"
previewPath = "/"
title = "Brew Logic"
description = "A full-stack Next.js Kuwait coffee store: frontend and API in one app, live MongoDB catalog, bcrypt/JWT customer accounts, separate Clerk-protected owner editing, cart, favorites, AI assistant, currency conversion, Arabic/English and light/dark modes. Checkout is a demo."
version = "1.0.0"
id = "artifacts/brew-logic"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api"]
localPort = 19233

[services.development]
run = "pnpm --filter @workspace/brew-logic run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/brew-logic", "run", "build"]
run = ["pnpm", "--filter", "@workspace/brew-logic", "run", "start"]

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "19233"
BASE_PATH = "/"
